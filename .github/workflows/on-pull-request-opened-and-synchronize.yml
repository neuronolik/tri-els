# Paused. Every workflow here runs on `workflow_dispatch` only, so nothing runs
# on a push or a pull request and nothing bills minutes. The triggers each one
# used are commented out below, so switching them back on is a matter of
# deleting the `workflow_dispatch` line and uncommenting them.

name: On Pull Request Opened And Synchronize

on:
  workflow_dispatch:

# on:
#   pull_request:
#     types: [opened, synchronize]
#   merge_group:
#     types: [checks_requested]

concurrency:
  group: ${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash -eu -o pipefail {0}

jobs:
  install-dependencies:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/pnpm

  format:
    name: Format
    runs-on: ubuntu-latest
    needs:
      - install-dependencies
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/pnpm
      - run: pnpm format
        env:
          NODE_ENV: production

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs:
      - install-dependencies
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/pnpm
      - run: pnpm start
        env:
          NODE_ENV: production
      - run: pnpm lint
        env:
          NODE_ENV: production

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs:
      - install-dependencies
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/pnpm
      - run: pnpm typecheck
        env:
          NODE_ENV: production

  test-lint-rules:
    name: Test (Lint Rules)
    runs-on: ubuntu-latest
    needs:
      - install-dependencies
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/pnpm
      - run: pnpm start:production:typescript
      - run: pnpm exec playwright test --config ./src/playwright/playwright.config.ts --project "lint rules"
        env:
          PLAYWRIGHT_NO_WEBSERVER: true

  test-functionality:
    name: Test (Functionality)
    runs-on: ubuntu-latest
    needs:
      - install-dependencies
    outputs:
      failed: ${{ steps.get-test-job-outcome.outputs.failed }}
    strategy:
      matrix:
        shardIndex: [1, 2, 3, 4, 5]
        shardTotal: [5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # https://github.com/actions/runner-images/issues/7048
      - name: Change Mirror Priorities
        run: |
          sudo sed -i '/archive.ubuntu.com\/ubuntu\/\tpriority/ s/priority:2/priority:0/' /etc/apt/apt-mirrors.txt
          sudo sed -i '/azure.archive.ubuntu.com\/ubuntu\/\tpriority/ s/priority:0/priority:1/' /etc/apt/apt-mirrors.txt
          sudo sed -i '/security.ubuntu.com\/ubuntu\/\tpriority/ s/priority:3/priority:2/' /etc/apt/apt-mirrors.txt
          sudo cat /etc/apt/apt-mirrors.txt
      - uses: ./.github/actions/pnpm
      - run: pnpm exec playwright install --no-shell --with-deps chromium firefox webkit
      - name: Test
        id: test
        run: pnpm exec playwright test --config ./src/playwright/playwright.config.ts --project functionality --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        continue-on-error: true
      - name: Get "Test" Job Outcome
        id: get-test-job-outcome
        run: |
          if [ "${{ steps.test.outcome }}" == "failure" ]; then
            echo "failed=true" >> $GITHUB_OUTPUT
          fi
      - name: Upload Coverage Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-${{ matrix.shardIndex }}
          path: ./dist/playwright/coverage-report
      - name: Upload Test Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-report-${{ matrix.shardIndex }}
          path: ./dist/playwright/test-report

  verify-test-results:
    name: Verify Test Results
    runs-on: ubuntu-latest
    needs:
      - test-functionality
    steps:
      - name: Report Test Failure
        if: ${{ needs.test-functionality.outputs.failed == 'true' }}
        run: |
          echo One or more tests failed. Download the test report artifact for details.
          exit 1

  verify-coverage:
    name: Verify Coverage
    runs-on: ubuntu-latest
    needs:
      - test-functionality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/pnpm
      - name: Download Coverage Reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ./dist/playwright
          pattern: coverage-report-*
      - name: Merge Coverage Reports
        run: pnpm exec tsx ./src/playwright/merge-coverage-reports/run.ts ${{ github.head_ref }}
